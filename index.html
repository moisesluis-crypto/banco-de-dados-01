<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro e Login</title>
    <!-- Utilizando Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
        
        <!-- Alternador de Abas (Cadastro / Login) -->
        <div class="flex border-b mb-6">
            <button id="btn-tab-cadastro" onclick="mudarAba('cadastro')" class="flex-1 pb-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 transition-all">Cadastro</button>
            <button id="btn-tab-login" onclick="mudarAba('login')" class="flex-1 pb-3 text-center font-semibold text-gray-400 hover:text-gray-600 transition-all">Login</button>
        </div>

        <!-- FORMULÁRIO DE CADASTRO -->
        <form id="form-cadastro" class="space-y-4" onsubmit="event.preventDefault(); alert('Cadastro realizado com sucesso!');">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Crie sua Conta</h2>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">Nome Completo</label>
                <input type="text" required placeholder="Ex: João da Silva" 
                    class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">CPF</label>
                <input type="text" required placeholder="000.000.000-00" maxlength="14" 
                    class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">E-mail (Gmail)</label>
                <input type="email" required placeholder="seuemail@gmail.com" 
                    class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Número de Telefone</label>
                <input type="tel" required placeholder="(00) 90000-0000" 
                    class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Data de Nascimento</label>
                <input type="date" required 
                    class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Senha</label>
                <input type="password" required placeholder="Mínimo de 6 caracteres" minlength="6"
                    class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
                Cadastrar
            </button>
        </form>

        <!-- FORMULÁRIO DE LOGIN (Inicialmente Oculto) -->
        <form id="form-login" class="space-y-4 hidden" onsubmit="event.preventDefault(); alert('Login efetuado com sucesso!');">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Acesse sua Conta</h2>

            <div>
                <label class="block text-sm font-medium text-gray-700">E-mail (Gmail)</label>
                <input type="email" required placeholder="seuemail@gmail.com" 
                    class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Senha</label>
                <input type="password" required placeholder="Sua senha" 
                    class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
                Entrar
            </button>
        </form>

    </div>

    <!-- Script simples para alternar entre as abas -->
    <script>
        function mudarAba(aba) {
            const formCadastro = document.getElementById('form-cadastro');
            const formLogin = document.getElementById('form-login');
            const btnCadastro = document.getElementById('btn-tab-cadastro');
            const btnLogin = document.getElementById('btn-tab-login');

            if (aba === 'cadastro') {
                formCadastro.classList.remove('hidden');
                formLogin.classList.add('hidden');
                btnCadastro.classList.add('border-b-2', 'border-blue-600', 'text-blue-600', 'font-bold');
                btnCadastro.classList.remove('text-gray-400', 'font-semibold');
                btnLogin.classList.remove('border-b-2', 'border-blue-600', 'text-blue-600', 'font-bold');
                btnLogin.classList.add('text-gray-400', 'font-semibold');
            } else {
                formLogin.classList.remove('hidden');
                formCadastro.classList.add('hidden');
                btnLogin.classList.add('border-b-2', 'border-blue-600', 'text-blue-600', 'font-bold');
                btnLogin.classList.remove('text-gray-400', 'font-semibold');
                btnCadastro.classList.remove('border-b-2', 'border-blue-600', 'text-blue-600', 'font-bold');
                btnCadastro.classList.add('text-gray-400', 'font-semibold');
            }
        }
    </script>
</body>
</html>
